services:

  - type: web
    name: jornal-backend
    runtime: python
    rootDir: ./backend 
    region: oregon 
    
    buildCommand: pip install -r app/requirements.txt
    
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3 
      - key: MONGO_DB_URL
        sync: false
      - key: MONGO_DB_NAME
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://jornal-frontend-sua-conta.onrender.com

  - type: web
    name: jornal-frontend
    rootDir: ./frontend 
    
    buildCommand: npm install && npm run build
    
    staticPublishPath: ./dist